services:
  - type: web
    name: sureshot-assistant
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: CBS_HOST
        value: sureshot.football.cbssports.com
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: AI_MODEL
        value: claude-sonnet-5-5
      - key: AI_DAILY_LIMIT
        value: "3"
      - key: AI_MONTHLY_CAP_USD
        value: "10"
